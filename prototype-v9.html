function course(){let l=flat[current],first=current===0;return `<div class="crumb">Mon parcours / Module ${pad(l.mi+1)} / Leçon ${current+1}</div><h1>${esc(l.name)}</h1><p class="desc">Module ${pad(l.mi+1)} — ${esc(modules[l.mi][0])}</p><div class="panel"><div class="section-head"><h2>🎬 Vidéo de la leçon</h2><span class="sub">Support à intégrer</span></div><div class="video"><button class="play" onclick="alert('Prototype : la vidéo pédagogique définitive sera intégrée ici.')" aria-label="Lire la vidéo">▶</button><div class="videolabel">Leçon ${current+1} · ${esc(l.name)}</div></div><div class="videonote">${videoNote(current)}</div></div><section class="panel reading"><div class="steps"><span class="step done">🎬 Regarder la vidéo</span><span class="step">📖 Lire le cours</span><span class="step">🧠 Réussir le quiz</span></div><h2>📖 Le cours écrit</h2>${lessonExtra(current) || (first?`<p>L’<strong>intelligence artificielle (IA)</strong> désigne un ensemble de méthodes informatiques qui permettent à des systèmes de réaliser des tâches telles que reconnaître des images, analyser du langage, trouver des régularités dans des données ou produire du contenu.</p><h3>1. Les grandes familles</h3><p><strong>IA à règles :</strong> un système applique des règles explicitement définies. <strong>Apprentissage automatique :</strong> il apprend des régularités à partir d’exemples. <strong>Apprentissage profond :</strong> il utilise des réseaux de neurones à plusieurs couches. <strong>IA générative :</strong> certains modèles peuvent produire du texte, des images, du son ou d’autres contenus.</p><h3>2. Comment reconnaître ces familles ?</h3><p>Une <strong>IA fondée sur des règles</strong> suit des instructions décidées par un humain : si une condition est remplie, elle applique une action. Dans l’<strong>apprentissage automatique</strong>, les règles utiles sont plutôt déduites de données. L’<strong>apprentissage profond</strong> constitue une sous-famille de l’apprentissage automatique utilisant des réseaux neuronaux à plusieurs couches. Enfin, l’<strong>IA générative</strong> décrit des systèmes capables de créer de nouveaux contenus : ce n’est pas une catégorie strictement parallèle aux précédentes, car elle peut employer l’apprentissage profond.</p><h3>3. Des usages concrets</h3><p>Les recommandations de films, la transcription vocale, les filtres anti-spam et les assistants conversationnels illustrent plusieurs applications possibles de l’IA.</p><div class="example"><strong>Exemple :</strong> demandez à un assistant IA d’expliquer en trois phrases ce qu’est l’apprentissage automatique, puis comparez l’explication à une source pédagogique fiable.</div><h3>4. Les limites essentielles</h3><p>Une IA peut générer des informations fausses, manquer de contexte ou reproduire des biais. Il faut garder un esprit critique, en particulier pour les décisions sensibles, et éviter de partager inutilement des données privées.</p><p class="notice">Ce cours est un exemple rédigé pour le prototype. Les contenus des autres leçons seront produits et vérifiés séparément.</p>`:`<p><strong>${esc(l.name)}</strong> : cette leçon figure à sa place exacte dans le programme de 132 leçons.</p><p>Cette partie accueillera un cours écrit complet et structuré : définition, explications progressives, exemples concrets, procédure détaillée et exercice intégré. Le contenu et la vidéo devront traiter exactement du même sujet.</p><div class="example"><strong>Prototype :</strong> le contenu final de cette leçon n’a pas encore été rédigé ni validé.</div>`) }</section><section class="panel"><div class="section-head"><h2>🧠 Valider la leçon</h2><span class="pill">${saved.has(current)?'✓ Terminée':'10 questions'}</span></div><p class="sub">${first?'Répondez au mini-quiz pour débloquer la suite.':'Le quiz définitif sera créé après validation du cours écrit. Pour cette maquette, le quiz de démonstration reprend celui de la première leçon.'}</p><button class="btn" onclick="startQuiz()">${saved.has(current)?'Refaire le quiz':'Commencer le quiz'} →</button></section><div class="bottom"><button class="btn secondary" onclick="${current?'openLesson('+(current-1)+')':'dashboard()'}">← ${current?'Leçon précédente':'Mon parcours'}</button><button class="btn secondary" onclick="${current<131?'openLesson('+(current+1)+')':'dashboard()'}" ${current<131&&!allowed(current+1)?'disabled':''}>${current===131?'Terminer':'Leçon suivante →'}</button></div>`}
function render(){nav();get('main').innerHTML=quiz?quizHTML():course()}

function quizHTML(){let q=questions[qidx];return `<div class="crumb">Module ${pad(flat[current].mi+1)} / Leçon ${current+1} / Quiz</div><h1>🧠 Quiz de fin de leçon</h1><p class="desc">10 questions · Réussite : au moins 8 bonnes réponses (seuil de démonstration)</p><section class="panel"><div class="stats"><strong>Question ${qidx+1} sur 10</strong><span class="sub">${(qidx+1)*10}%</span></div><div class="track"><div class="bar" style="width:${(qidx+1)*10}%"></div></div><h2 style="margin-top:25px">${esc(q[0])}</h2><div style="display:grid;gap:10px">${q[1].map((o,i)=>`<button class="opt ${answers[qidx]===i?'selected':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="qnav"><button class="btn secondary" ${qidx===0?'disabled':''} onclick="prevQ()">← Précédente</button><button class="btn" ${answers[qidx]===undefined?'disabled':''} onclick="nextQ()">${qidx===9?'Corriger mon quiz':'Suivante →'}</button></div></section><p class="faq">Vous pouvez modifier vos réponses avant de valider. Les questions de cette démo concernent la première leçon.</p>`}
function choose(i){answers[qidx]=i;render()}function prevQ(){qidx=Math.max(0,qidx-1);render()}function nextQ(){if(answers[qidx]===undefined)return;if(qidx<9){qidx++;render()}else result()}
function result(){let score=questions.filter((q,i)=>answers[i]===q[2]).length;let passed=score>=8;if(passed){saved.add(current);localStorage.setItem('academie_demo_passed',JSON.stringify([...saved]))}quiz=false;nav();get('main').innerHTML=`<div class="crumb">Mon parcours / Résultat du quiz</div><section class="panel" style="text-align:center;padding:35px 24px"><div style="font-size:40px">${passed?'🎉':'📘'}</div><h1>${passed?'Leçon validée !':'Continuez vos efforts'}</h1><p class="desc">Résultat de votre évaluation</p><div style="font-size:48px;font-weight:800;color:${passed?'#15803d':'#b45309'}">${score}/10</div><p>${passed?'Bravo, la prochaine leçon est débloquée.':'Le seuil de démonstration est 8/10. Relisez les explications puis réessayez.'}</p><div class="topactions" style="justify-content:center;flex-wrap:wrap"><button class="btn secondary" onclick="openLesson(${current})">Revoir le cours</button><button class="btn" onclick="${passed&&current<131?'openLesson('+(current+1)+')':'startQuiz()'}">${passed?'Leçon suivante →':'Refaire le quiz →'}</button></div></section><section class="panel"><h2>📝 Correction détaillée</h2><p class="small-note">Pour chaque question, comparez votre réponse et la bonne réponse.</p>${questions.map((q,i)=>`<div class="review-item"><strong>Question ${i+1}. ${esc(q[0])}</strong><p class="${answers[i]===q[2]?'correct':'wrong'}">${answers[i]===q[2]?'✓':'✕'} Votre réponse : ${esc(q[1][answers[i]])}</p><p class="correct">Bonne réponse : ${esc(q[1][q[2]])}</p></div>`).join('')}</section>`;window.scrollTo(0,0)}

function fillCatalogue(q){

}

const originalQuizHTML=quizHTML;quizHTML=function(){if(current===0)return originalQuizHTML();let q=tailoredQuestions(current)[qidx];return `<div class="crumb">Leçon ${current+1} / Quiz</div><h1>🧠 Quiz de fin de leçon</h1><p class="desc">10 questions · Seuil provisoire : 8/10</p><section class="panel"><div class="stats"><strong>Question ${qidx+1} / 10</strong></div><div class="track"><div class="bar" style="width:${(qidx+1)*10}%"></div></div><h2 style="margin-top:25px">${esc(q[0])}</h2><div style="display:grid;gap:10px">${q[1].map((o,i)=>`<button class="opt ${answers[qidx]===i?'selected':''}" onclick="choose(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><div class="qnav"><button class="btn secondary" ${qidx===0?'disabled':''} onclick="prevQ()">← Précédente</button><button class="btn" ${answers[qidx]===undefined?'disabled':''} onclick="nextQ()">${qidx===9?'Corriger mon quiz':'Suivante →'}</button></div></section>`};
const oldResult=result;result=function(){if(current===0){let score=questions.filter((q,i)=>answers[i]===q[2]).length;v5.scores[current]=Math.max(v5.scores[current]||0,score);persistV5();oldResult();return}let qq=tailoredQuestions(current);if(!qq)return;let score=qq.filter((q,i)=>answers[i]===q[2]).length;let passed=score>=8;if(passed){saved.add(current);localStorage.setItem('academie_demo_passed',JSON.stringify([...saved]))}v5.scores[current]=Math.max(v5.scores[current]||0,score);persistV5();quiz=false;nav();get('main').innerHTML=`<div class="crumb">Leçon ${current+1} / Résultat</div><section class="panel" style="text-align:center"><div style="font-size:42px">${passed?'🎉':'📖'}</div><h1>${passed?'Leçon validée !':'Encore un petit effort'}</h1><div style="font-size:44px;font-weight:800;color:#2563eb">${score}/10</div><p>${passed?'La leçon suivante est débloquée.':'Relisez votre cours puis retentez le quiz.'}</p><div class="buttonbar" style="justify-content:center"><button class="btn secondary" onclick="openLesson(${current})">Relire</button><button class="btn" onclick="${passed&&current<131?`openLesson(${current+1})`:'startQuiz()'}">${passed?'Leçon suivante →':'Réessayer →'}</button></div></section><section class="panel"><h2>📝 Correction</h2>${qq.map((q,i)=>`<div class="review-item"><strong>${i+1}. ${esc(q[0])}</strong><p class="${answers[i]===q[2]?'correct':'wrong'}">Votre réponse : ${esc(q[1][answers[i]])}</p><p class="correct">Bonne réponse : ${esc(q[1][q[2]])}</p></div>`).join('')}</section>`;window.scrollTo(0,0)};
// L'administration permet désormais des quiz QCM effectifs : une ligne = question|A|B|C|D|n°bonne réponse(1-4).
adminQuiz=function(){let i=adminLesson,existing=(v5.quizBank[i]||[]).map(q=>[q[0],...q[1],q[2]+1].join(' | ')).join('\n');adminLayout('Gestion des quiz','Configurez les dix questions propres à chaque leçon pour rendre son quiz jouable.',`<section class="panel"><label class="field"><span>📚 Leçon</span><select id="admin-quizlesson" onchange="adminLesson=Number(this.value);adminQuiz()">${flat.map((x,k)=>`<option value="${k}" ${k===i?'selected':''}>${k+1}. ${esc(x.name)}</option>`).join('')}</select></label><p class="notice">🧠 10 lignes exactement, au format <strong>Question | Choix A | Choix B | Choix C | Choix D | 1</strong>. Le dernier chiffre (1 à 4) indique la bonne réponse. Pour la première leçon, le quiz de démonstration est déjà prêt.</p><label class="field"><span>Questions du quiz (10)</span><textarea id="quiz-entry" style="min-height:270px" placeholder="Quelle est la bonne réponse ? | Réponse A | Réponse B | Réponse C | Réponse D | 2">${esc(existing)}</textarea></label><div class="buttonbar"><button class="btn" onclick="saveQuizBank()">💾 Enregistrer le quiz</button><button class="btn secondary" onclick="openLesson(${i})">👀 Aperçu étudiant</button></div><p id="quiz-feedback" class="small-note" aria-live="polite"></p></section>`)};
function saveQuizBank(){let raw=get('quiz-entry').value.trim(),lines=raw.split(/\r?\n/).filter(x=>x.trim());if(lines.length!==10){get('quiz-feedback').textContent='⚠️ Il faut exactement 10 lignes.';return}let parsed=[];for(let n=0;n<lines.length;n++){let parts=lines[n].split('|').map(p=>p.trim());if(parts.length!==6||parts.slice(0,5).some(p=>!p)||!/^[1-4]$/.test(parts[5])){get('quiz-feedback').textContent=`⚠️ Ligne ${n+1} : format invalide.`;return}parsed.push([parts[0],parts.slice(1,5),Number(parts[5])-1])}v5.quizBank[adminLesson]=parsed;persistV5();get('quiz-feedback').innerHTML='✅ Quiz de 10 questions enregistré dans ce navigateur. Il est maintenant jouable sur la leçon sélectionnée.'}

function activatePlan(plan){if(!PRICES[plan])return;if(!v5.active){signup();return}v5.plan=plan;v5.expiresAt=expiresAfter(plan).toISOString();v5.renewCount=0;persistV5();showSubscriptionConfirmation()}
function showSubscriptionConfirmation(){layoutPage('Offres / Accès de démonstration','✅ Offre activée (simulation)','Cette activation sert uniquement à tester le prototype. Aucun paiement n’a été effectué.',`<section class="panel"><h2>${PRICES[v5.plan]?.name||'Offre'}</h2><p>✅ Accès jusqu’au <strong>${fmtDate(v5.expiresAt)}</strong>.</p><p>${v5.plan==='essai'?'Accès limité au module 01.':'Accès au parcours complet.'}</p><button class="btn" onclick="dashboard()">🏠 Accéder à mon tableau de bord →</button><button class="btn secondary" onclick="accountPage()">👤 Voir mon abonnement</button></section>`)}
function renewSimulated(){if(!v5.active||!v5.plan||v5.plan==='essai'){pricing();return}if(['trimestreclub','integralclub'].includes(v5.plan)){layoutPage('Mon compte / Prolongation','⚠️ Tarif à préciser','La prolongation avec Club IA n’a pas encore de tarif validé.',`<section class="panel"><button class="btn" onclick="pricing()">Voir les offres →</button></section>`);return}let amount=v5.plan==='trimestre'?15:v5.plan==='integral'?10:29;let base=activeAccess()?new Date(v5.expiresAt):new Date();base.setMonth(base.getMonth()+1);v5.expiresAt=base.toISOString();v5.renewCount=(v5.renewCount||0)+1;persistV5();layoutPage('Mon compte / Prolongation','✅ Prolongation simulée',`Montant indicatif : ${euro(amount)} · Aucun paiement réel.`,`<section class="panel"><h2>Accès prolongé</h2><p>Nouvelle échéance : <strong>${fmtDate(v5.expiresAt)}</strong>.</p><button class="btn" onclick="accountPage()">Retour à mon abonnement →</button></section>`)}
function demoExpire(){v5.expiresAt=new Date(Date.now()-1000).toISOString();persistV5();accountPage()}
function accountPage(){layoutPage('Espace étudiant / Mon compte','👤 Mon abonnement','État simulé de votre accès aux cours.',`<section class="panel"><h2>${v5.active?'Bonjour '+userName()+' 👋':'Aucun profil de démonstration'}</h2>${v5.active?`<div class="rowlist">Profil <strong>${esc(v5.email||'—')}</strong></div><div class="rowlist">Formule <strong>${PRICES[v5.plan]?.name||'Aucune'}</strong></div><div class="rowlist">Échéance <strong>${fmtDate(v5.expiresAt)}</strong></div><div class="rowlist">Accès <strong>${activeAccess()?'🟢 Actif':'🔒 Expiré / non souscrit'}</strong></div><div class="rowlist">Leçons validées <strong>${saved.size} / 132</strong></div><div class="buttonbar" style="margin-top:18px"><button class="btn" onclick="pricing()">💳 Changer de formule</button><button class="btn secondary" onclick="renewSimulated()">🔁 Simuler une prolongation</button><button class="btn secondary" onclick="demoExpire()">🧪 Simuler une expiration</button><button class="btn secondary" onclick="disconnectDemo()">🚪 Déconnexion</button></div>`:`<button class="btn" onclick="signup()">Créer un profil démo</button>`}</section><p class="notice">🧪 Il s'agit d'un test local, sans compte sécurisé, carte bancaire ou débit.</p>`)}
function accessWarning(){layoutPage('Accès / Abonnement','🔒 Accès à la formation suspendu','Choisissez ou renouvelez une formule pour consulter les leçons et leurs quiz.',`<section class="panel"><h2>${v5.plan?'Votre accès a expiré':'Aucune formule active'}</h2><p>Vos résultats précédents restent sauvegardés.</p><button class="btn" onclick="pricing()">💳 Voir les offres</button><button class="btn secondary" onclick="accountPage()">Mon abonnement</button></section>`)}
function hasLessonAccess(index){if(!activeAccess())return false;return v5.plan!=='essai'||flat[index]?.mi===0}
const _v6OpenLesson=openLesson;openLesson=function(i){if(!hasLessonAccess(i)){accessWarning();return}_v6OpenLesson(i)};
const _v6StartQuiz=startQuiz;startQuiz=function(){if(!hasLessonAccess(current)){accessWarning();return}_v6StartQuiz()};
const _v6Render=render;render=function(){if(!hasLessonAccess(current)&&typeof quiz!=='undefined'){accessWarning();return}_v6Render()};


// V7 — Communauté privée. Démonstration locale uniquement.
const CLUB_KEY='academie_ia_club_demo_v7';
let clubFilter='Tous';
const clubDefaults=[
 {id:'demo1',category:'🚀 Nouveautés IA',title:'Bienvenue au Club IA !',body:'Cet espace privé réunira les actualités IA sélectionnées par l’Académie. Chaque publication pourra contenir une explication, des exemples pratiques et des liens vers les sources. Ceci est une publication de démonstration.',url:'',date:'2026-10-26T12:00:00',comments:[],likes:0},
 {id:'demo2',category:'💼 Business IA',title:'Comment lire une opportunité business ?',body:'Avant de tester une idée, identifiez le problème client, le coût des outils IA et la valeur du service proposé. Un futur article approfondira chaque étape. Ceci est un exemple fictif.',url:'',date:'2026-10-26T11:30:00',comments:[],likes:0}
];
let clubData;
try{clubData=JSON.parse(localStorage.getItem(CLUB_KEY)||'null')}catch(e){}
if(!clubData||!Array.isArray(clubData.posts))clubData={posts:clubDefaults,liked:[],saved:[]};
function persistClub(){localStorage.setItem(CLUB_KEY,JSON.stringify(clubData))}
function clubEligible(){return activeAccess()&&['mensuel','trimestreclub','integralclub'].includes(v5.plan)}
function clubShell(title,subtitle,content){layoutPage('Académie IA / Club IA',title,subtitle,content)}
function communityPage(filter=clubFilter){clubFilter=filter;if(!clubEligible()){clubShell('🔒 Le Club IA — réservé aux membres','Les nouveautés technologiques et business sont réservées aux abonnés actifs.',`<section class="panel"><h2>🌐 Votre espace communautaire privé</h2><p>🚀 Actualités IA · 💼 Opportunités business · 🛠️ Nouveaux outils · 💬 Discussions entre membres</p><p>L’accès est inclus dans les formules <strong>29 €/mois</strong>, <strong>99 € / 3 mois</strong> et <strong>149 € / 12 mois</strong>. L’essai à 5 € ne comprend pas le Club IA.</p><p>Quand l’abonnement expire, l’accès à cet espace est suspendu.</p><button class="btn" onclick="pricing()">💳 Voir les offres</button></section>`);return}
let cats=['Tous','🚀 Nouveautés IA','💼 Business IA','🛠️ Outils','📚 Conseils','📢 Annonces'];
let posts=[...clubData.posts].filter(p=>filter==='Tous'||p.category===filter).sort((a,b)=>new Date(b.date)-new Date(a.date));
clubShell('🌐 Le Club IA','Votre fil privé : les nouveautés et idées sélectionnées par l’Académie.',`<section class="panel"><div class="club-tags">${cats.map(x=>`<button class="navchip ${filter===x?'active':''}" onclick="communityPage('${x}')">${x}</button>`).join('')}</div><p class="small-note" style="margin:12px 0 0">🔐 Réservé aux abonnés actifs · Les articles ci-dessous sont des démonstrations, pas des actualités vérifiées.</p></section><div class="club-grid">${posts.map(p=>clubPost(p)).join('')||'<section class="panel">Aucune publication pour ce thème.</section>'}</div>`)}
function clubPost(p){let liked=clubData.liked.includes(p.id),bookmarked=clubData.saved.includes(p.id);return `<article class="club-post"><div class="club-meta"><span>🎓 Académie IA · ${esc(p.category)}</span><span>${new Date(p.date).toLocaleDateString('fr-FR')}</span></div><h2>${esc(p.title)}</h2><p style="white-space:pre-wrap;color:#43546d">${esc(p.body)}</p>${p.url?`<p><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">🔗 Consulter la source</a></p>`:''}<div class="club-actions"><button class="club-action ${liked?'active':''}" onclick="clubToggle('${p.id}','liked')">${liked?'💙':'🤍'} J’aime · ${p.likes||0}</button><button class="club-action ${bookmarked?'active':''}" onclick="clubToggle('${p.id}','saved')">${bookmarked?'🔖 Enregistré':'🔖 Enregistrer'}</button><button class="club-action" onclick="clubShowComments('${p.id}')">💬 ${p.comments.length} commentaire(s)</button></div><div id="comments-${p.id}" class="club-comments hide">${p.comments.map(c=>`<div class="club-comment"><strong>${esc(c.name)}</strong> <span class="small-note">${new Date(c.date).toLocaleDateString('fr-FR')}</span><p>${esc(c.text)}</p></div>`).join('')}<label class="field"><span>Votre commentaire</span><input class="club-input" maxlength="500" id="comment-input-${p.id}" placeholder="Écrire un commentaire constructif…"></label><button class="btn secondary" onclick="clubAddComment('${p.id}')">Publier mon commentaire</button></div></article>`}
function clubToggle(id,which){if(!clubEligible())return;let p=clubData.posts.find(p=>p.id===id);if(!p)return;let set=clubData[which],exists=set.includes(id);clubData[which]=exists?set.filter(x=>x!==id):[...set,id];if(which==='liked')p.likes=Math.max(0,(p.likes||0)+(exists?-1:1));persistClub();communityPage()}
function clubShowComments(id){get('comments-'+id)?.classList.toggle('hide')}
function clubAddComment(id){if(!clubEligible())return;let p=clubData.posts.find(p=>p.id===id);let entry=get('comment-input-'+id);let value=entry?.value.trim();if(!p||!value)return;p.comments.push({name:v5.name||'Membre',text:value.slice(0,500),date:new Date().toISOString()});persistClub();communityPage();clubShowComments(id)}
function clubAdminPage(){adminLayout('🌐 Publications du Club IA','Rédigez et gérez vos publications de démonstration. Les nouveaux articles restent dans ce navigateur.',`<section class="club-compose"><label class="field"><span>Thème</span><select id="club-category" class="club-input"><option>🚀 Nouveautés IA</option><option>💼 Business IA</option><option>🛠️ Outils</option><option>📚 Conseils</option><option>📢 Annonces</option></select></label><label class="field"><span>Titre</span><input id="club-title" maxlength="120" class="club-input" placeholder="Ex. Une nouvelle tendance de l’IA"></label><label class="field"><span>Contenu</span><textarea id="club-body" maxlength="3500" class="club-input" placeholder="Expliquez la nouveauté, ses bénéfices et ses limites…"></textarea></label><label class="field"><span>Lien source (facultatif)</span><input id="club-url" type="url" class="club-input" placeholder="https://..."></label><button class="btn" onclick="clubPublish()">📢 Publier dans le Club IA</button><p id="club-feedback" class="small-note"></p></section><section class="panel"><h2>🗂️ Publications (${clubData.posts.length})</h2>${[...clubData.posts].reverse().map(p=>`<div class="review-item"><strong>${esc(p.title)}</strong><p class="small-note">${esc(p.category)} · ${new Date(p.date).toLocaleDateString('fr-FR')}</p><button class="btn secondary" onclick="clubDelete('${p.id}')">Supprimer</button></div>`).join('')}</section>`)}
function clubPublish(){let title=get('club-title').value.trim(),body=get('club-body').value.trim(),url=get('club-url').value.trim();if(!title||!body){get('club-feedback').textContent='⚠️ Ajoutez un titre et un contenu.';return}if(url){try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error()}catch{get('club-feedback').textContent='⚠️ Utilisez une adresse http(s) valide.';return}}clubData.posts.push({id:'post'+Date.now(),title,body,category:get('club-category').value,url,date:new Date().toISOString(),likes:0,comments:[]});persistClub();clubAdminPage()}
function clubDelete(id){clubData.posts=clubData.posts.filter(p=>p.id!==id);persistClub();clubAdminPage()}
const v7AdminGo=adminGo;adminGo=function(tab){if(tab==='club'){adminTab=tab;clubAdminPage();return}v7AdminGo(tab);const tabs=get('main')?.querySelector('.admin-tabs');if(tabs){let button=document.createElement('button');button.textContent='🌐 Communauté';button.onclick=()=>adminGo('club');tabs.appendChild(button)}};

// Démarrer sur l'accueil public lors de la première visite ; ailleurs reprendre l'expérience existante.
landing();

</script></body></html>
